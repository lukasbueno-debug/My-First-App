<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador de clicks | Colegio Bolívar</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #143c28;
    }

    main {
      padding: 32px;
      text-align: center;
      background: white;
      border-radius: 16px;
      box-shadow: 0 6px 24px #00000015;
    }

    #contador {
      display: block;
      margin: 24px 0;
      font-size: 64px;
      font-weight: bold;
    }

    button {
      padding: 14px 24px;
      border: none;
      border-radius: 8px;
      background: #17633c;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      background: #104b2c;
    }

    button:focus-visible {
      outline: 3px solid #e5b934;
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Eventos del Colegio Bolívar</h1>
    <p>¡Haz click para sumar tu participación!</p>
    <output id="contador" aria-live="polite" aria-label="Total de clicks">0</output>
    <button id="sumar" type="button">Sumar un click</button>
  </main>

  <script>
    let clicks = 0;
    const contador = document.getElementById("contador");
    const boton = document.getElementById("sumar");

    boton.addEventListener("click", function () {
      clicks++;
      contador.textContent = clicks;
    });
  </script>
</body>
</html>
