<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador de eventos | Colegio Bolívar</title>
  <link rel="stylesheet" href="style.css">
  <script src="actions.js" defer></script>
</head>
<body>
  <main>
    <h1 id="titulo">Eventos del Colegio Bolívar</h1>
    <p>¡Haz click para sumar tu participación!</p>

    <label for="nuevo-titulo">Nombre del evento:</label>
    <input
      id="nuevo-titulo"
      type="text"
      placeholder="Escribe un nuevo título"
    >

    <output
      id="contador"
      aria-live="polite"
      aria-label="Total de clicks"
    >0</output>

    <div class="botones">
      <button id="sumar" type="button">Sumar un click</button>
      <button id="reiniciar" type="button">Reiniciar</button>
    </div>
  </main>
</body>
</html>
